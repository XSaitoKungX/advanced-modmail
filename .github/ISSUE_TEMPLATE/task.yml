name: Engineering task
description: Track technical, maintenance or project work
title: "[Task]: "
labels:
  - "type: chore"
  - "status: needs-triage"

body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the goal of this task.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what should and should not be changed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe when this task can be considered complete.
    validations:
      required: true
