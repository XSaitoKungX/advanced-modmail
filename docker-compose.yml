services:
  postgres:
    image: postgres:18.6-trixie
    container_name: relaya-postgres
    environment:
      POSTGRES_USER: relaya
      POSTGRES_PASSWORD: relaya-dev
      POSTGRES_DB: relaya
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - relaya-pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaya -d relaya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relaya-pgdata:
